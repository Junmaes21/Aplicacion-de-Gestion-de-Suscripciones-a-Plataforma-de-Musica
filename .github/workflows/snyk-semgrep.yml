name: Snyk and Semgrep security
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with: { config: p/ci }
      - uses: snyk/actions/dotnet@master
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        with: { command: test, args: --all-projects --severity-threshold=high }
      - run: docker build --tag sonora-api:ci .
      - uses: snyk/actions/docker@master
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        with: { image: sonora-api:ci, args: --severity-threshold=high }
